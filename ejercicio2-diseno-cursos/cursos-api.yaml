openapi: 3.0.3
info:
  title: API de Cursos
  description: API para administrar cursos académicos.
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/cursos

tags:
  - name: Cursos

paths:
  /:
    get:
      tags: [Cursos]
      summary: Consultar cursos
      operationId: consultarCursos
      responses:
        "200":
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Curso"
    post:
      tags: [Cursos]
      summary: Crear curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoRequest"
      responses:
        "201":
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
        "400":
          description: Datos inválidos

  /{id}:
    put:
      tags: [Cursos]
      summary: Actualizar curso
      operationId: actualizarCurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoRequest"
      responses:
        "200":
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
        "404":
          description: Curso no encontrado
    delete:
      tags: [Cursos]
      summary: Eliminar curso
      operationId: eliminarCurso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Curso eliminado
        "404":
          description: Curso no encontrado

  /codigo/{codigo}:
    get:
      tags: [Cursos]
      summary: Consultar curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
        "404":
          description: Curso no encontrado

components:
  schemas:
    Estado:
      type: string
      enum: [ACTIVO, INACTIVO]

    CursoRequest:
      type: object
      required: [nombre, codigo, creditos]
      properties:
        nombre:
          type: string
        codigo:
          type: string
        creditos:
          type: integer
        estado:
          $ref: "#/components/schemas/Estado"

    Curso:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
        - $ref: "#/components/schemas/CursoRequest"
